name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

# —— S3 审计（2026-10-31）：默认只读（B-2）——除 windows tag 发布 job 显式
# contents: write 外，其余 job 的 GITHUB_TOKEN 统一收敛为 contents: read。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # —— S0 CI 缓存配方：钉版号即缓存 key 分量，升级依赖时同步 bump ——
  TAURI_CLI_VERSION: "2.12.4"
  CARGO_NDK_VERSION: "4.1.2"
  KEEPASSXC_VERSION: "2.7.12"

jobs:
  changes:
    # DR-015 分区触发：paths-filter 判定变更面，各 job 按需执行（tag 推送无条件全量）。
    # skipped 的 check 被 GitHub 视为通过——"七 job 全绿"门禁语义不变。
    # 注：scripts/**（安装器/PATH 脚本）不进过滤面——PR 门禁不覆盖，由 tag 构建全量验证。
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      rust_root: ${{ steps.filter.outputs.rust_root }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
      extension: ${{ steps.filter.outputs.extension }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（S3 审计 SHA 钉版）
        with:
          fetch-depth: 0 # push 事件需 before 提交做 diff（合并提交多 parent，浅克隆不可靠）
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3（SHA 钉版）
        id: filter
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'design_docs/**'
            rust_root:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
            desktop:
              - 'desktop/**'
            android:
              - 'android/**'
              - 'crates/sp-kffi/**'
              - 'crates/sp-core/**'
              - 'crates/sp-kdbx/**'
            extension:
              - 'extension/**'
            workflows:
              - '.github/workflows/ci.yml'

  windows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.rust_root == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write  # tag 流程：gh release create/upload（draft Release，DR-007）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（S3 审计 SHA 钉版）
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4（S3 审计 SHA 钉版）
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4（S3 审计 SHA 钉版）
        with:
          node-version: 22
          # 不加 cache: pnpm——PR 运行不执行 pnpm install，store 目录不存在会导致
          # setup-node 后置保存路径校验失败、整个 job 红（首跑实测 2026-10-30）；
          # tag 构建收益仅 30-60s，不值得。extension job 的 pnpm 缓存保留。

      - name: Install Rust toolchain (locked by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable 分支头（S3 审计钉版；升级需有意 bump）
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2（S3 审计 SHA 钉版）

      - name: Cache KeePassXC portable (round-trip interop tests)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（S3 审计 SHA 钉版）
        id: keepassxc
        with:
          path: keepassxc-portable
          key: keepassxc-${{ env.KEEPASSXC_VERSION }}-windows-x64

      - name: Download KeePassXC portable (cache miss only)
        if: steps.keepassxc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ env.KEEPASSXC_VERSION }}"
          $zip = "KeePassXC-$tag-Win64.zip"
          Invoke-WebRequest -Uri "https://github.com/keepassxreboot/keepassxc/releases/download/$tag/$zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath keepassxc-portable

      - name: Locate keepassxc-cli（SP_KEEPASSXC_CLI 指向解压路径）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = (Get-ChildItem -Path keepassxc-portable -Recurse -Filter keepassxc-cli.exe | Select-Object -First 1).FullName
          if (-not $cli) { throw "keepassxc-cli.exe not found under keepassxc-portable" }
          Add-Content -Path $env:GITHUB_ENV -Value "SP_KEEPASSXC_CLI=$cli"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Build release (crt-static, SP-C-104 packaging)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --workspace

      - name: Cache tauri-cli (desktop bundle, tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（S3 审计 SHA 钉版）
        id: tauri_cli_win
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-windows-x64

      - name: Install tauri-cli (desktop bundle, tag only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.tauri_cli_win.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked

      - name: Install desktop GUI deps (DR-014：tauri build 的 beforeBuildCommand 需 node_modules)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle (NSIS, tag only; crt-static 自包含)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/src-tauri
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo tauri build

      - name: Build extension (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package (sp.exe + sp-nmhost.exe + README + SHA256SUMS)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/sp.exe "$out/sp.exe"
          Copy-Item target/release/sp-nmhost.exe "$out/sp-nmhost.exe"
          Copy-Item README.md "$out/README.md"
          New-Item -ItemType Directory -Force -Path "$out/native-host" | Out-Null
          Copy-Item native-host/register.ps1 "$out/native-host/"
          Copy-Item native-host/unregister.ps1 "$out/native-host/" -ErrorAction SilentlyContinue
          Copy-Item native-host/README.md "$out/native-host/"
          # 桌面壳 NSIS 安装包（DR-013 批次 1 起纳入发布线）
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe "$out/"
          # 免安装 zip 初始化脚本 + CLI 手册（须先于 CLI NSIS 打包——.nsi 从 dist 取文件）
          Copy-Item scripts/install.ps1 "$out/"
          Copy-Item scripts/add-path.ps1 "$out/"
          New-Item -ItemType Directory -Force -Path "$out/docs/manual" | Out-Null
          Copy-Item docs/manual/sp_cli_manual.md "$out/docs/manual/"
          # CLI 单安装包（NSIS；crt-static 自包含 + PATH 可选 + 卸载器）
          & "$env:LOCALAPPDATA/tauri/NSIS/makensis.exe" "-DVER=${{ github.ref_name }}" "-DSRC=$pwd/dist" "scripts/installer/sp-cli.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item scripts/installer/sp-cli-*.exe "$out/" -Force -ErrorAction Stop
          # 浏览器扩展（商店/解压两用 zip：dist 内容为根）
          Compress-Archive -Path extension/dist/* -DestinationPath "$out/superpasswdkey-extension-${{ github.ref_name }}.zip" -Force
          Push-Location $out
          # 相对路径入清单（保留 native-host/ 子目录；避免平铺产生同名歧义）
          $h = Get-ChildItem -File -Recurse | Get-FileHash -Algorithm SHA256
          $h | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Substring((Get-Location).Path.Length + 1) } | Out-File -Encoding ascii SHA256SUMS.txt
          Compress-Archive -Path sp.exe, sp-nmhost.exe, README.md, install.ps1, native-host, docs, SHA256SUMS.txt, *.exe, *.zip -DestinationPath "sp-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip" -Force
          Pop-Location
          Get-ChildItem $out

      - name: Create draft release + upload assets（签名由维护者本地完成后发布，DR-007）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view ${{ github.ref_name }} >/dev/null 2>&1 || gh release create ${{ github.ref_name }} --draft --title "SuperPasswdKey ${{ github.ref_name }}" --generate-notes
          gh release upload ${{ github.ref_name }} dist/sp-*.zip dist/*.exe dist/superpasswdkey-extension-*.zip dist/SHA256SUMS.txt --clobber

      - name: Upload release artifact（workflow 留档）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4（S3 审计 SHA 钉版）
        with:
          name: sp-windows-release
          path: dist/*.zip

  linux:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.rust_root == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（S3 审计 SHA 钉版）
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (locked by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable 分支头（S3 审计钉版；升级需有意 bump）
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2（S3 审计 SHA 钉版）

      - name: Install KeePassXC (round-trip interop tests)
        run: sudo apt-get update && sudo apt-get install -y keepassxc

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  deny:
    # cargo-deny-action 是容器 action，仅支持 Linux（首次 CI 实测教训）
    needs: changes
    # 扫描面 = 根 workspace + desktop 独立 manifest，两者任一变更即跑
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.rust_root == 'true' || needs.changes.outputs.desktop == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（S3 审计 SHA 钉版）
      # 容器内无 rust-toolchain.toml 锁定版本（1.99.1 musl 未预装），覆盖为 stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2（S3 审计 SHA 钉版）
        with:
          rust-version: "stable"
      # desktop 独立 workspace（tauri 树；配置 desktop/src-tauri/deny.toml，
      # graph.targets 收敛 MSVC——与 ubuntu 容器宿主无关）
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2（S3 审计 SHA 钉版）
        with:
          rust-version: "stable"
          manifest-path: desktop/src-tauri/Cargo.toml

  desktop:
    # 桌面壳门禁（DR-013 批次 1，任务书_step7 任务 4）：独立 workspace
    # （tauri/wry/tao 仅 MSVC 可构建，不并入根 workspace 防 linux CI 失败）
    # DR-014：GUI 前端 Vue3+Vite，cargo tauri build 前需 pnpm 构建产物（beforeBuildCommand）
    needs: changes
    # path 依赖 ../../crates/sp-*（rust_root）→ 桌面壳与根内核变更都需重跑
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.rust_root == 'true' || needs.changes.outputs.desktop == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（S3 审计 SHA 钉版）
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4（S3 审计 SHA 钉版）
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4（S3 审计 SHA 钉版）
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/ui/pnpm-lock.yaml

      - name: Install GUI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile

      - name: GUI tests (vitest)
        working-directory: desktop/ui
        run: pnpm test

      - name: Install Rust toolchain (locked by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable 分支头（S3 审计钉版；升级需有意 bump）
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2（S3 审计 SHA 钉版）
        with:
          workspaces: desktop/src-tauri

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Cache tauri-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（S3 审计 SHA 钉版）
        id: tauri_cli
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-windows-x64

      - name: Install tauri-cli
        if: steps.tauri_cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked

      - name: tauri build (release + NSIS bundle)
        run: cargo tauri build

  android:
    # Android 交叉编译 + Kotlin 绑定漂移检查（DR-009；design_docs/13 §4.3）
    # ubuntu-latest 预装 Android SDK/NDK（ANDROID_HOME 已设），cargo-ndk 自动取最新 NDK
    needs: changes
    # sp-kffi path 依赖 sp-core/sp-kdbx（rust_root 覆盖 crates/**）
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.rust_root == 'true' || needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（S3 审计 SHA 钉版）
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (locked by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable 分支头（S3 审计钉版；升级需有意 bump）
        with:
          components: rustfmt, clippy

      - name: Install Android targets (on the pinned toolchain)
        run: rustup target add x86_64-linux-android aarch64-linux-android

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2（S3 审计 SHA 钉版）

      - name: Cache cargo-ndk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（S3 审计 SHA 钉版）
        id: cargondk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-linux-x64

      - name: Install cargo-ndk
        if: steps.cargondk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Cross-compile (x86_64 emulator + aarch64 release target)
        run: |
          cargo ndk -t x86_64-linux-android --platform 28 -- build -p sp-kffi
          cargo ndk -t aarch64-linux-android --platform 28 -- build -p sp-kffi --release

      - name: Kotlin bindings drift check
        run: |
          cargo build -p sp-kffi
          ./target/debug/uniffi-bindgen generate --library target/debug/libsp_kffi.so \
            --language kotlin --out-dir /tmp/bindgen-check --no-format
          diff -r /tmp/bindgen-check/uniffi/sp_kffi android/app/src/main/java/uniffi/sp_kffi

  android-e2e:
    # 模拟器 e2e（M1 出口报告 backlog 落地）：x86_64 KVM 模拟器跑 TestActivity 断言集
    # （FFI 面 + 首建校准链路 init_vault + 超时锁库注入 idle_timeout_ms）。
    # fixture 口令为 SRS §5 允许入仓的测试专用值，经 intent extra 传递不落盘（SP-F-804）。
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.rust_root == 'true' || needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（S3 审计 SHA 钉版）
        with:
          fetch-depth: 0

      - name: Free disk space (API 34 AVD userdata 需数 GB；否则 FATAL not enough space)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          ls -dt /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -n +2 | xargs -r sudo rm -rf
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Rust toolchain (locked by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable 分支头（S3 审计钉版；升级需有意 bump）

      - name: Install Android target (on the pinned toolchain)
        run: rustup target add x86_64-linux-android

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2（S3 审计 SHA 钉版）

      - name: Cache cargo-ndk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（S3 审计 SHA 钉版）
        id: cargondk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-linux-x64

      - name: Install cargo-ndk
        if: steps.cargondk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Cross-compile sp-kffi (x86_64 emulator)
        run: |
          mkdir -p android/app/src/main/jniLibs/x86_64
          cargo ndk -t x86_64-linux-android --platform 28 -- build -p sp-kffi
          cp target/x86_64-linux-android/debug/libsp_kffi.so android/app/src/main/jniLibs/x86_64/

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4（S3 审计 SHA 钉版）
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Generate fixture (test-only credentials, SRS §5)
        run: |
          mkdir -p build
          SP_TEST_DB_PASSWORD=sp-test-only \
          SP_TEST_ENTRY_PASSWORD=sp-test-entry \
          SP_TEST_ENTRY_URL=https://com.superpasswdkey.spike \
            cargo run -q -p sp-kffi --example make_spike_vault -- build/test_vault.kdbx

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew :app:assembleDebug

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve runner image version（SDK/AVD 缓存 key 分量）
        run: echo "RUNNER_IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache Android SDK system images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（S3 审计 SHA 钉版）
        with:
          # 只缓存 system-images：emulator/platform-tools 是 runner 预装目录（root 属主），
          # 恢复时原地覆盖报 Cannot utime → 整包作废（2026-10-30 run 实测）
          path: /usr/local/lib/android/sdk/system-images
          key: android-sdk-images-api34-google_apis-x86_64-v2-${{ env.RUNNER_IMAGE }}

      - name: Cache AVD snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（S3 审计 SHA 钉版）
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ~/.android/debug.keystore
          key: avd-api34-google_apis-x86_64-v2-${{ env.RUNNER_IMAGE }}

      - name: Clean stale AVD locks（异常退出残留锁会卡死下次启动）
        run: find ~/.android/avd -name "*.lock" -delete 2>/dev/null || true

      - name: Generate AVD snapshot for caching (cache miss only)
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2（S3 审计 SHA 钉版）
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          cores: 4
          emulator-boot-timeout: 900
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run emulator e2e (TestActivity assertions)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2（S3 审计 SHA 钉版）
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          cores: 4
          emulator-boot-timeout: 900
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # 快照里可能带有旧调试签名的同包名应用，先卸载再装，规避签名不匹配（2026-10-30 run 实测）
            adb uninstall com.superpasswdkey.spike >/dev/null 2>&1 || true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb push build/test_vault.kdbx /data/local/tmp/
            adb shell run-as com.superpasswdkey.spike mkdir -p files
            adb shell run-as com.superpasswdkey.spike cp /data/local/tmp/test_vault.kdbx files/vault.kdbx
            adb logcat -c
            adb shell am start -n com.superpasswdkey.spike/.TestActivity --es db_password sp-test-only --es entry_password sp-test-entry --es entry_username demo-user --es entry_url https://com.superpasswdkey.spike --ez init_vault true --ei idle_timeout_ms 2000
            for i in $(seq 1 36); do if adb logcat -d -s SPIKE | grep -q "M1 E2E DONE"; then break; fi; sleep 5; done
            adb logcat -d -s SPIKE | tee e2e_logcat.txt
            grep -q "ALL E2E CHECKS PASSED" e2e_logcat.txt
            grep -q "PASS: createVault" e2e_logcat.txt
            grep -q "PASS: idle timeout lock" e2e_logcat.txt
            if grep -qE "FAIL:|FATAL:|PENDING:" e2e_logcat.txt; then echo "::error::e2e reported failure lines"; exit 1; fi

  extension:
    # 浏览器扩展构建门禁（SP-F-704/705；fuzz 不进 CI——design_docs/07）
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.extension == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（S3 审计 SHA 钉版）
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4（S3 审计 SHA 钉版）
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4（S3 审计 SHA 钉版）
        with:
          node-version: 22 # pnpm 11 要求 ≥22.13
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
