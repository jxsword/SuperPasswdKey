name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      SP_KEEPASSXC_CLI: "C:\\Program Files\\KeePassXC\\keepassxc-cli.exe"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (locked by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install KeePassXC (round-trip interop tests)
        run: choco install keepassxc -y --no-progress

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  deny:
    # cargo-deny-action 是容器 action，仅支持 Linux（首次 CI 实测教训）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 容器内无 rust-toolchain.toml 锁定版本（1.99.1 musl 未预装），覆盖为 stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "stable"

      - name: Build release (crt-static, SP-C-104 packaging)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --workspace

      - name: Package (sp.exe + README + SHA256SUMS)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/sp.exe "$out/sp.exe"
          Copy-Item README.md "$out/README.md"
          Push-Location $out
          $h = Get-ChildItem -File | Get-FileHash -Algorithm SHA256
          $h | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Split('\')[-1] } | Out-File -Encoding ascii SHA256SUMS.txt
          Compress-Archive -Path sp.exe, README.md, SHA256SUMS.txt -DestinationPath "sp-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip" -Force
          Pop-Location
          Get-ChildItem $out

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: sp-windows-release
          path: dist/*.zip
