[package]
name = "sp-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "SuperPasswdKey desktop shell (Tauri tray + unlock window + session, DR-013 batch 1)"
publish = false

[workspace]
# 独立 workspace：tauri/wry/tao 仅 MSVC 可构建，不并入根 workspace（防 linux CI 失败，
# 任务书_step7 设计闸门）；经 path 依赖复用根 workspace 的 sp-core/sp-kffi

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 内核复用：会话语义与 sp-kffi actor 同源（DR-012 A1 凭据因子留驻 + save_session）
sp-core = { path = "../../crates/sp-core" }
sp-kffi = { path = "../../crates/sp-kffi" }

[dev-dependencies]
sp-kdbx = { path = "../../crates/sp-kdbx" }

[profile.release]
strip = true
lto = true
