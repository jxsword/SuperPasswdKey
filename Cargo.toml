[workspace]
resolver = "2"
members = ["crates/sp-core", "crates/sp-kdbx", "crates/sp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
authors = ["juejian <2301879213@qq.com>"]
repository = "https://github.com/jxsword/SuperPasswdKey"
description = "Local-first, zero-knowledge password/secret manager CLI with KDBX4 interoperability"

[workspace.dependencies]
# 内部
sp-core = { path = "crates/sp-core" }
sp-kdbx = { path = "crates/sp-kdbx" }
# KDBX
keepass-ng = { version = "0.11", features = ["save_kdbx4", "totp"] }
# 加密
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = "0.10"
argon2 = "0.5"
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
# CLI
clap = { version = "4", features = ["derive"] }
rpassword = "7"
arboard = "3"
# 错误/工具
thiserror = "2"
anyhow = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
