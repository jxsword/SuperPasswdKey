# cargo-deny 配置（SP-C-102/SP-N-304：零网络 crate 禁入 + 许可证兼容）

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "AGPL-3.0-only",
    "AGPL-3.0",
    "GPL-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
# 零网络红线（SP-N-304）：网络栈 crate 一律禁入
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "tokio" },          # v0.1 同步实现，无异步网络需求
    { name = "ureq" },
    { name = "curl" },
    { name = "attohttpc" },
]

[advisories]
version = 2
yanked = "warn"
# 供应链纪律（红线 #10）：每条豁免记录理由，随上游更新重审
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained — age 0.12.1 构建期 i18n 宏传递依赖，非运行时解析不可信输入；随 age 升级重审" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 时序变异 — age X25519 传递依赖；本地单用户工具威胁模型下接受，随 age 升级重审" },
    { id = "RUSTSEC-2026-0367", reason = "zip SUID/SGID 提取提权 — sp 仅写入归档（从不解包不可信 zip），提取 API 不在攻击面内；随 zip 升级重审" },
    { id = "RUSTSEC-2026-0368", reason = "zip 符号链接逃逸 — 同上：只写不读，提取路径不可达；随 zip 升级重审" },
    { id = "RUSTSEC-2026-0369", reason = "zip 符号链接权限 — 同上：只写不读；随 zip 升级重审" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
