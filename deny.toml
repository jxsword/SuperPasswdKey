# cargo-deny 配置（SP-C-102/SP-N-304：零网络 crate 禁入 + 许可证兼容）

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "AGPL-3.0-only",
    "AGPL-3.0",
    "GPL-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
# 零网络红线（SP-N-304）：网络栈 crate 一律禁入
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "tokio" },          # v0.1 同步实现，无异步网络需求
    { name = "ureq" },
    { name = "curl" },
    { name = "attohttpc" },
]

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
